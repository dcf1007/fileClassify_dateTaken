name: Apply corrected EXIF implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  restore-test-and-commit:
    if: github.head_ref == 'agent/replace-pillow-pyexiftool'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool

      - name: Restore final script and README
        shell: bash
        run: |
          cat .github/tmp/final_script.part* | base64 --decode | gzip --decompress > reclassify_datetaken.py
          cat .github/tmp/final_readme.part* | base64 --decode | gzip --decompress > README.md
          echo 'f01c3918b83c91b95a33e4e63726c42b6c708cdd685bb8f808e52532229a3753  reclassify_datetaken.py' | sha256sum --check
          echo 'a5f0fdcc402693162e0b107c3ceb47e299811c4555318eaf0cb6a11f36c0df72  README.md' | sha256sum --check

      - name: Install ExifTool and Python dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl
          python -m pip install -r requirements.txt

      - name: Compile and exercise corrected-copy metadata writes
        shell: bash
        run: |
          python -m py_compile reclassify_datetaken.py
          python - <<'PY'
          import base64
          import subprocess
          import tempfile
          from datetime import timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_text = Path('reclassify_datetaken.py').read_text(encoding='utf-8')
          definitions = source_text.split(
              '# Request the source directory and intentionally process only regular files',
              1,
          )[0]
          namespace = {}
          exec(compile(definitions, 'reclassify_datetaken.py', 'exec'), namespace)

          jpeg_bytes = base64.b64decode(
              ''
          )

          with tempfile.TemporaryDirectory() as temp_name:
              temp_dir = Path(temp_name)
              source_file = temp_dir / 'source.jpg'
              output_dir = temp_dir / 'out'
              output_dir.mkdir()
              destination_file = output_dir / source_file.name
              source_file.write_bytes(jpeg_bytes)

              subprocess.run(
                  [
                      'exiftool', '-overwrite_original',
                      '-DateTimeOriginal=2024:09:14 00:40:47',
                      '-CreateDate=2024:09:14 00:40:49',
                      '-ModifyDate=2024:01:15 12:00:00',
                      '-OffsetTimeOriginal=+01:00',
                      '-OffsetTimeDigitized=+01:00',
                      '-OffsetTime=+02:00',
                      str(source_file),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              helper = namespace['ExifToolHelper'](common_args=['-G0:1:4'])
              helper.run()
              try:
                  first = namespace['copy_file_with_corrected_exif'](
                      helper,
                      source_file,
                      destination_file,
                      timedelta(hours=1),
                      ZoneInfo('Europe/Berlin'),
                  )
                  assert first[1] is True
                  assert first[3]

                  second = namespace['copy_file_with_corrected_exif'](
                      helper,
                      source_file,
                      destination_file,
                      timedelta(hours=1),
                      ZoneInfo('Europe/Berlin'),
                  )
                  assert second[1] is False
                  assert second[0] == destination_file
              finally:
                  helper.terminate()

              def read(tag, filename):
                  return subprocess.run(
                      ['exiftool', '-s3', f'-{tag}', str(filename)],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout.strip()

              assert read('DateTimeOriginal', destination_file) == '2024:09:14 01:40:47'
              assert read('CreateDate', destination_file) == '2024:09:14 01:40:49'
              assert read('ModifyDate', destination_file) == '2024:01:15 13:00:00'
              assert read('OffsetTimeOriginal', destination_file) == '+02:00'
              assert read('OffsetTimeDigitized', destination_file) == '+02:00'
              assert read('OffsetTime', destination_file) == '+01:00'
              assert read('DateTimeOriginal', source_file) == '2024:09:14 00:40:47'
          PY

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          rm -rf .github/tmp
          rm -f .github/workflows/temporary-copy-exif-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update EXIF fields in corrected copies'
          git push origin HEAD:agent/replace-pillow-pyexiftool
