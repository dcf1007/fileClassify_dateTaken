name: Retest IPTC corrected-copy timestamps

on:
  push:
    branches:
      - agent/replace-pillow-pyexiftool
    paths:
      - .github/workflows/retest-iptc-time-correction.yml

permissions:
  contents: write

jobs:
  retest-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0
          persist-credentials: true

      - name: Run IPTC correction test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes libimage-exiftool-perl
            python -m pip install -r requirements.txt
            python - <<'PY'
          import base64
          import json
          import subprocess
          import tempfile
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_text = Path("reclassify_datetaken.py").read_text(encoding="utf-8")
          definitions = source_text.split(
              "# Request the source directory and intentionally process only regular files",
              1,
          )[0]
          namespace = {}
          exec(compile(definitions, "reclassify_datetaken.py", "exec"), namespace)

          def value_for(metadata, family, tag):
              for key, value in metadata.items():
                  parts = key.split(":")
                  if parts[0] == family and parts[-1] == tag:
                      return value
              raise KeyError((family, tag, sorted(metadata)))

          jpeg_bytes = base64.b64decode(
              ""
          )

          with tempfile.TemporaryDirectory() as temp_name:
              root = Path(temp_name)
              source = root / "source.jpg"
              destination = root / "classified" / "2024-09-15" / "source.jpg"
              destination.parent.mkdir(parents=True)
              source.write_bytes(jpeg_bytes)
              subprocess.run([
                  "exiftool", "-overwrite_original",
                  "-IPTC:DateCreated=2024:09:14",
                  "-IPTC:TimeCreated=23:40:47",
                  str(source),
              ], check=True, capture_output=True, text=True)

              helper = namespace["ExifToolHelper"](common_args=["-G0:1:4"])
              helper.run()
              try:
                  result = namespace["copy_file_with_corrected_metadata"](
                      helper,
                      source,
                      destination,
                      timedelta(hours=1),
                      datetime(2024, 9, 15, 0, 40, 47),
                      ZoneInfo("Europe/Berlin"),
                  )
              finally:
                  helper.terminate()

              output, copied, renamed, updated, skipped, existing = result
              assert output == destination and copied and not renamed and not existing
              args = ["exiftool", "-j", "-G0:1", "-IPTC:DateCreated", "-IPTC:TimeCreated"]
              source_metadata = json.loads(subprocess.run(
                  [*args, str(source)], check=True, capture_output=True, text=True
              ).stdout)[0]
              output_metadata = json.loads(subprocess.run(
                  [*args, str(output)], check=True, capture_output=True, text=True
              ).stdout)[0]
              parse_partial = namespace["parse_partial_datetime"]
              source_pair = parse_partial(
                  value_for(source_metadata, "IPTC", "DateCreated"),
                  value_for(source_metadata, "IPTC", "TimeCreated"),
              )
              output_pair = parse_partial(
                  value_for(output_metadata, "IPTC", "DateCreated"),
                  value_for(output_metadata, "IPTC", "TimeCreated"),
              )
              if source_pair[1] is None:
                  assert output_pair == (source_pair[0] + timedelta(hours=1), None)
              else:
                  assert output_pair == (source_pair[0], 120)
              assert any(target.endswith("DateCreated") for target in updated)
              assert any(target.endswith("TimeCreated") for target in updated)
              print("IPTC corrected-copy test passed")
              print("source:", source_metadata)
              print("output:", output_metadata)
              print("updated:", updated)
              print("skipped:", skipped)
          PY
          } 2>&1 | tee /tmp/iptc-correction-retest.log

      - name: Commit IPTC retest report
        if: always()
        shell: bash
        run: |
          mkdir -p .github/tmp
          {
            echo "outcome=${{ steps.tests.outcome }}"
            echo "commit=$(git rev-parse HEAD)"
            echo
            cat /tmp/iptc-correction-retest.log 2>/dev/null || true
          } > .github/tmp/iptc-time-correction-retest-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/iptc-time-correction-retest-result.txt
          git commit -m "Record IPTC timestamp correction retest"
          git push origin HEAD:agent/replace-pillow-pyexiftool
