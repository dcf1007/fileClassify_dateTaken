name: Finalize EXIF copy correction

on:
  push:
    branches:
      - agent/replace-pillow-pyexiftool
    paths:
      - .github/tmp/run-finalize-exif-copy-correction

permissions:
  contents: write

jobs:
  restore-test-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0
          persist-credentials: true

      - name: Restore verified source files
        shell: bash
        run: |
          cat .github/tmp/final_script.part* | base64 --decode | gzip --decompress > reclassify_datetaken.py
          cat .github/tmp/final_readme.part* | base64 --decode | gzip --decompress > README.md
          echo 'f01c3918b83c91b95a33e4e63726c42b6c708cdd685bb8f808e52532229a3753  reclassify_datetaken.py' | sha256sum --check
          echo 'a5f0fdcc402693162e0b107c3ceb47e299811c4555318eaf0cb6a11f36c0df72  README.md' | sha256sum --check

      - name: Install ExifTool and Python dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl
          python -m pip install -r requirements.txt

      - name: Compile and test corrected-copy EXIF writes
        shell: bash
        run: |
          python -m py_compile reclassify_datetaken.py
          python - <<'PY'
          import base64
          import json
          import subprocess
          import tempfile
          from datetime import timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_text = Path('reclassify_datetaken.py').read_text(encoding='utf-8')
          definitions = source_text.split(
              '# Request the source directory and intentionally process only regular files',
              1,
          )[0]
          namespace = {}
          exec(compile(definitions, 'reclassify_datetaken.py', 'exec'), namespace)

          jpeg_bytes = base64.b64decode(
              ''
          )

          def read_dates(path):
              result = subprocess.run(
                  [
                      'exiftool', '-j', '-G1',
                      '-DateTimeOriginal', '-CreateDate', '-ModifyDate',
                      '-OffsetTimeOriginal', '-OffsetTimeDigitized', '-OffsetTime',
                      str(path),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)[0]

          with tempfile.TemporaryDirectory() as temp_name:
              temp_dir = Path(temp_name)
              source_file = temp_dir / 'source.jpg'
              output_dir = temp_dir / 'out'
              output_dir.mkdir()
              destination_file = output_dir / source_file.name
              source_file.write_bytes(jpeg_bytes)

              subprocess.run(
                  [
                      'exiftool', '-overwrite_original',
                      '-DateTimeOriginal=2024:09:14 00:40:47',
                      '-CreateDate=2024:09:14 00:40:49',
                      '-ModifyDate=2024:01:15 12:00:00',
                      '-OffsetTimeOriginal=+01:00',
                      '-OffsetTimeDigitized=+01:00',
                      '-OffsetTime=+02:00',
                      str(source_file),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              source_before = read_dates(source_file)

              reader = namespace['ExifToolHelper'](common_args=['-G0:1:4'])
              reader.run()
              try:
                  actual_destination, copied, renamed, updated = namespace[
                      'copy_file_with_corrected_exif'
                  ](
                      reader,
                      source_file,
                      destination_file,
                      timedelta(hours=1),
                      ZoneInfo('Europe/Berlin'),
                  )
              finally:
                  reader.terminate()

              assert copied and not renamed
              assert actual_destination == destination_file
              assert updated
              assert read_dates(source_file) == source_before

              copied_dates = read_dates(destination_file)
              assert copied_dates['ExifIFD:DateTimeOriginal'] == '2024:09:14 01:40:47'
              assert copied_dates['ExifIFD:CreateDate'] == '2024:09:14 01:40:49'
              assert copied_dates['IFD0:ModifyDate'] == '2024:01:15 13:00:00'
              assert copied_dates['ExifIFD:OffsetTimeOriginal'] == '+02:00'
              assert copied_dates['ExifIFD:OffsetTimeDigitized'] == '+02:00'
              assert copied_dates['ExifIFD:OffsetTime'] == '+01:00'
          PY

      - name: Remove temporary delivery files
        shell: bash
        run: |
          rm -f .github/tmp/final_script.part*
          rm -f .github/tmp/final_readme.part*
          rm -f .github/tmp/run-finalize-exif-copy-correction
          rm -f apply-exif-copy-correction.patch
          rm -f .github/workflows/apply-exif-copy-correction.yml
          rm -f .github/workflows/temporary-copy-exif-correction.yml
          rm -f .github/workflows/finalize-exif-copy-correction.yml
          rmdir .github/tmp 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit finalized implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite EXIF timestamps in corrected copies"
          git push origin HEAD:agent/replace-pillow-pyexiftool
