name: Apply generic corrected-copy timestamp handling

on:
  push:
    branches:
      - agent/replace-pillow-pyexiftool
    paths:
      - .github/workflows/apply-generic-time-correction.yml
      - .github/tmp/update_time_correction.part*

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply updater
        shell: bash
        run: |
          cat .github/tmp/update_time_correction.part* | base64 --decode > /tmp/update_time_correction.py
          python /tmp/update_time_correction.py
          python -m py_compile reclassify_datetaken.py
          grep -q '^import os$' reclassify_datetaken.py
          ! grep -q '^import tempfile$' reclassify_datetaken.py
          grep -q '^def copy_file_with_corrected_metadata' reclassify_datetaken.py
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/tmp/update_time_correction.part*
          rm -rf __pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct all local timestamps in classified copies"
          git push origin HEAD:agent/replace-pillow-pyexiftool
