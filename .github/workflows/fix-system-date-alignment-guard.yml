name: Fix system date alignment guard

on:
  pull_request:
    branches:
      - agent/replace-pillow-pyexiftool
    paths:
      - .github/tmp/run-system-date-guard-fix

permissions:
  contents: write

jobs:
  fix-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard selected offset calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("reclassify_datetaken.py")
          text = path.read_text(encoding="utf-8")

          old_comment = (
              "            date_conflict_resolved = True\n\n"
              "    # Remember the rejected embedded values per file. The copy pass\n"
              "            # aligns only eligible capture/creation fields carrying one of\n"
          )
          new_comment = (
              "            date_conflict_resolved = True\n\n"
              "            # Remember the rejected embedded values per file. The copy pass\n"
              "            # aligns only eligible capture/creation fields carrying one of\n"
          )
          if text.count(old_comment) != 1:
              raise SystemExit("conflict comment indentation marker not found")
          text = text.replace(old_comment, new_comment, 1)

          old_offsets = (
              "        selected_offsets = {\n"
              "            offset_record[2]\n"
              "            for offset_record in selected_date_option.get(\n"
              "                \"offset_records\",\n"
              "                [],\n"
              "            )\n"
              "        }\n"
              "        if len(selected_offsets) == 1:\n"
              "            preferred_system_offset_minutes = next(iter(selected_offsets))\n"
          )
          new_offsets = (
              "            selected_offsets = {\n"
              "                offset_record[2]\n"
              "                for offset_record in selected_date_option.get(\n"
              "                    \"offset_records\",\n"
              "                    [],\n"
              "                )\n"
              "            }\n"
              "            if len(selected_offsets) == 1:\n"
              "                preferred_system_offset_minutes = next(\n"
              "                    iter(selected_offsets)\n"
              "                )\n"
          )
          if text.count(old_offsets) != 1:
              raise SystemExit("unguarded selected-offset block not found")
          text = text.replace(old_offsets, new_offsets, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile and verify guard structure
        shell: bash
        run: |
          python -m py_compile reclassify_datetaken.py
          python - <<'PY'
          from pathlib import Path

          text = Path("reclassify_datetaken.py").read_text(encoding="utf-8")
          required = (
              "            selected_offsets = {\n"
              "                offset_record[2]\n"
              "                for offset_record in selected_date_option.get(",
              "            if len(selected_offsets) == 1:\n"
              "                preferred_system_offset_minutes = next(\n",
              "            # Remember the rejected embedded values per file.",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing guarded structure: {marker!r}")
          if "\n        selected_offsets = {\n" in text:
              raise SystemExit("selected-offset calculation remains outside guard")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-system-date-alignment-guard.yml
          git add reclassify_datetaken.py
          git commit -m "Guard system timestamp offset selection"
          git push origin HEAD:agent/replace-pillow-pyexiftool
