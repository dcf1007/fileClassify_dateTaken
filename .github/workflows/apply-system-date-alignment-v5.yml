name: Apply system date alignment v5

on:
  pull_request:
    branches:
      - agent/replace-pillow-pyexiftool
    paths:
      - .github/tmp/run-system-date-alignment-v5

permissions:
  contents: write

jobs:
  update-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source and README transformation
        shell: bash
        run: |
          awk '
            /^      - name: Apply source and README transformation$/ {
              in_step = 1
              next
            }
            in_step && /^        run: \|$/ {
              capture = 1
              next
            }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/apply-system-date-alignment-v4.yml > /tmp/apply-step.sh

          sed -i 's/if count != 1:/if count < 1:/' /tmp/apply-step.sh
          sed -i 's/expected one malformed block/expected at least one malformed block/' /tmp/apply-step.sh
          sed -i 's/patch_text = patch_text.replace(old, new, 1)/patch_text = patch_text.replace(old, new)/' /tmp/apply-step.sh
          bash /tmp/apply-step.sh

      - name: Compile and run focused regression checks
        shell: bash
        run: |
          awk '
            /^      - name: Compile and run focused regression checks$/ {
              in_step = 1
              next
            }
            in_step && /^        run: \|$/ {
              capture = 1
              next
            }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/apply-system-date-alignment-v4.yml > /tmp/test-step.sh
          bash /tmp/test-step.sh

      - name: Commit finalized files and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-system-date-alignment.yml
          git rm -f .github/workflows/apply-system-date-alignment-v2.yml
          git rm -f .github/workflows/apply-system-date-alignment-v3.yml
          git rm -f .github/workflows/apply-system-date-alignment-v4.yml
          git rm -f .github/workflows/apply-system-date-alignment-v5.yml
          git add reclassify_datetaken.py README.md
          git commit -m "Align system file dates to selected value"
          git push origin HEAD:agent/replace-pillow-pyexiftool
