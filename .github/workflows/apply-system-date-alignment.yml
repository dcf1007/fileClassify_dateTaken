name: Apply system date alignment

on:
  pull_request:
    branches:
      - agent/replace-pillow-pyexiftool
    paths:
      - .github/tmp/run-system-date-alignment

permissions:
  contents: write

jobs:
  update-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source and README changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path("reclassify_datetaken.py")
          text = script_path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
          '''def get_unambiguous_timezone_offset(local_datetime, classification_timezone):
              """Return the sole valid UTC offset for a local time, or None."""
              state = get_unambiguous_timezone_state(
                  local_datetime,
                  classification_timezone,
              )
              return state[1] if state is not None else None


          def get_metadata_write_target(groups, tag_name, raw=False):
          ''',
          '''def get_unambiguous_timezone_offset(local_datetime, classification_timezone):
              """Return the sole valid UTC offset for a local time, or None."""
              state = get_unambiguous_timezone_state(
                  local_datetime,
                  classification_timezone,
              )
              return state[1] if state is not None else None


          def resolve_system_timestamp_offset(
              local_datetime,
              classification_timezone,
              preferred_offset_minutes=None,
          ):
              """Resolve one UTC offset for an absolute filesystem timestamp."""
              valid_offsets = {
                  state[1]
                  for state in timezone_states_for_local_time(
                      local_datetime,
                      classification_timezone,
                  )
              }
              if preferred_offset_minutes in valid_offsets:
                  return preferred_offset_minutes
              if len(valid_offsets) == 1:
                  return next(iter(valid_offsets))
              return None


          def system_datetime_to_epoch_ns(local_datetime, offset_minutes):
              """Convert a chosen local timestamp and offset to Unix nanoseconds."""
              aware_datetime = local_datetime.replace(
                  tzinfo=timezone(timedelta(minutes=offset_minutes))
              )
              utc_datetime = aware_datetime.astimezone(timezone.utc)
              epoch = datetime(1970, 1, 1, tzinfo=timezone.utc)
              delta = utc_datetime - epoch
              return (
                  (delta.days * 86400 + delta.seconds) * 1_000_000_000
                  + delta.microseconds * 1000
              )


          def get_metadata_write_target(groups, tag_name, raw=False):
          ''',
          "system timestamp helpers",
          )

          replace_once(
          '''def build_correction_operations(
              source_metadata,
              correction_delta,
              selected_corrected_datetime,
              classification_timezone,
              conflicting_date_values=None,
          ):
              """Build writes for timezone correction and chosen-date alignment."""
              timezone_correction_active = correction_delta is not None
              effective_correction_delta = correction_delta or timedelta(0)
              conflicting_date_values = set(conflicting_date_values or ())
              operations = {}
          ''',
          '''def build_correction_operations(
              source_metadata,
              correction_delta,
              selected_corrected_datetime,
              classification_timezone,
              conflicting_date_values=None,
              align_system_times=False,
              preferred_system_offset_minutes=None,
          ):
              """Build metadata and system-create-date alignment operations."""
              timezone_correction_active = correction_delta is not None
              effective_correction_delta = correction_delta or timedelta(0)
              conflicting_date_values = set(conflicting_date_values or ())
              metadata_correction_active = (
                  timezone_correction_active or bool(conflicting_date_values)
              )
              operations = {}
          ''',
          "build_correction_operations signature",
          )

          replace_once(
          '''    for tag_name in OFFSET_CONTEXT_TAGS:
                  for metadata_key, groups, raw_value in values_by_tag.get(tag_name, []):
          ''',
          '''    for tag_name in OFFSET_CONTEXT_TAGS:
                  if not metadata_correction_active:
                      break
                  for metadata_key, groups, raw_value in values_by_tag.get(tag_name, []):
          ''',
          "offset correction guard",
          )

          replace_once(
          '''    expected_state = get_unambiguous_timezone_state(
                  selected_corrected_datetime,
                  classification_timezone,
              )
          ''',
          '''    expected_state = (
                  get_unambiguous_timezone_state(
                      selected_corrected_datetime,
                      classification_timezone,
                  )
                  if metadata_correction_active
                  else None
              )
          ''',
          "DST correction guard",
          )

          replace_once(
          '''    # System creation time is shifted only for a timezone/DST correction.
              # Choosing among conflicting embedded creation dates must not replace an
              # unrelated filesystem creation timestamp with the capture timestamp.
              if timezone_correction_active:
                  for metadata_key, groups, tag_name, raw_value in records:
                      if tag_name != "FileCreateDate":
                          continue
                      try:
                          parsed = parse_complete_metadata_datetime(raw_value)
                      except ValueError:
                          parsed = None
                      if parsed is None:
                          continue
                      local_datetime, _ = parsed
                      expected_local = local_datetime + effective_correction_delta
                      expected_offset = get_unambiguous_timezone_offset(
                          expected_local,
                          classification_timezone,
                      )
                      expected_text = format_complete_datetime(
                          raw_value,
                          expected_local,
                          expected_offset,
                      )
                      add_correction_operation(
                          operations,
                          skipped,
                          {
                              "target": "FileCreateDate",
                              "value": expected_text,
                              "kind": "datetime",
                              "expected": (expected_local, expected_offset),
                              "tag_name": tag_name,
                              "source": metadata_key,
                          },
                      )
          ''',
          '''    # Align the existing system creation time to the absolute final
              # selected capture timestamp. The preferred offset comes from the
              # chosen metadata when it is compatible with the selected timezone;
              # otherwise an unambiguous timezone-database offset is used.
              if align_system_times:
                  expected_offset = resolve_system_timestamp_offset(
                      selected_corrected_datetime,
                      classification_timezone,
                      preferred_system_offset_minutes,
                  )
                  if expected_offset is None:
                      skipped.add(
                          "FileCreateDate (ambiguous selected-date UTC offset)"
                      )
                  else:
                      expected = (
                          selected_corrected_datetime,
                          expected_offset,
                      )
                      for metadata_key, groups, tag_name, raw_value in records:
                          if tag_name != "FileCreateDate":
                              continue
                          try:
                              parsed = parse_complete_metadata_datetime(raw_value)
                          except ValueError:
                              parsed = None
                          if parsed is None:
                              skipped.add(
                                  f"{metadata_key} (invalid FileCreateDate)"
                              )
                              continue
                          if parsed == expected:
                              continue
                          add_correction_operation(
                              operations,
                              skipped,
                              {
                                  "target": "FileCreateDate",
                                  "value": format_complete_datetime(
                                      raw_value,
                                      selected_corrected_datetime,
                                      expected_offset,
                                  ),
                                  "kind": "datetime",
                                  "expected": expected,
                                  "tag_name": tag_name,
                                  "source": metadata_key,
                              },
                          )
          ''',
          "absolute FileCreateDate alignment",
          )

          replace_once(
          '''def update_corrected_copy_metadata(
              metadata_reader,
              source_file,
              destination_file,
              correction_delta,
              selected_corrected_datetime,
              classification_timezone,
              conflicting_date_values=None,
          ):
              """Correct writable metadata and applicable system times in a copy."""
          ''',
          '''def update_corrected_copy_metadata(
              metadata_reader,
              source_file,
              destination_file,
              correction_delta,
              selected_corrected_datetime,
              classification_timezone,
              conflicting_date_values=None,
              align_system_times=False,
              preferred_system_offset_minutes=None,
          ):
              """Correct metadata and align supported system times in a copy."""
          ''',
          "update_corrected_copy_metadata signature",
          )

          replace_once(
          '''        classification_timezone,
                  conflicting_date_values,
              )
              updated, write_skipped = execute_correction_operations(
          ''',
          '''        classification_timezone,
                  conflicting_date_values,
                  align_system_times,
                  preferred_system_offset_minutes,
              )
              updated, write_skipped = execute_correction_operations(
          ''',
          "build_correction_operations call",
          )

          replace_once(
          '''    # FileModifyDate is shifted only for a timezone/DST correction. Date
              # conflict alignment updates the rejected embedded creation fields but
              # does not overwrite unrelated filesystem modification semantics.
              if correction_delta is not None:
                  source_stat = source_file.stat()
                  corrected_mtime_ns = source_stat.st_mtime_ns + int(
                      correction_delta.total_seconds() * 1_000_000_000
                  )
                  destination_stat = destination_file.stat()
                  os.utime(
                      destination_file,
                      ns=(destination_stat.st_atime_ns, corrected_mtime_ns),
                  )
                  if destination_file.stat().st_mtime_ns != corrected_mtime_ns:
                      raise OSError(
                          f"could not verify corrected FileModifyDate for '{destination_file}'"
                      )
                  updated.append("FileModifyDate")
          ''',
          '''    # FileModifyDate is the most widely consumed system timestamp, so
              # align it to the absolute final selected capture time rather than
              # applying a delta to an unrelated source-file modification time.
              if align_system_times:
                  expected_offset = resolve_system_timestamp_offset(
                      selected_corrected_datetime,
                      classification_timezone,
                      preferred_system_offset_minutes,
                  )
                  if expected_offset is None:
                      plan_skipped.add(
                          "FileModifyDate (ambiguous selected-date UTC offset)"
                      )
                  else:
                      selected_mtime_ns = system_datetime_to_epoch_ns(
                          selected_corrected_datetime,
                          expected_offset,
                      )
                      destination_stat = destination_file.stat()
                      if destination_stat.st_mtime_ns != selected_mtime_ns:
                          os.utime(
                              destination_file,
                              ns=(destination_stat.st_atime_ns, selected_mtime_ns),
                          )
                          if destination_file.stat().st_mtime_ns != selected_mtime_ns:
                              raise OSError(
                                  "could not verify aligned FileModifyDate for "
                                  f"'{destination_file}'"
                              )
                          updated.append("FileModifyDate")
          ''',
          "absolute FileModifyDate alignment",
          )

          replace_once(
          '''def copy_file_with_corrected_metadata(
              metadata_reader,
              source_file,
              requested_destination,
              correction_delta,
              selected_corrected_datetime,
              classification_timezone,
              conflicting_date_values=None,
          ):
          ''',
          '''def copy_file_with_corrected_metadata(
              metadata_reader,
              source_file,
              requested_destination,
              correction_delta,
              selected_corrected_datetime,
              classification_timezone,
              conflicting_date_values=None,
              align_system_times=False,
              preferred_system_offset_minutes=None,
          ):
          ''',
          "copy_file_with_corrected_metadata signature",
          )

          replace_once(
          '''            classification_timezone,
                      conflicting_date_values,
                  )
              except OSError:
          ''',
          '''            classification_timezone,
                      conflicting_date_values,
                      align_system_times,
                      preferred_system_offset_minutes,
                  )
              except OSError:
          ''',
          "update_corrected_copy_metadata call",
          )

          replace_once(
          '''        timezone_correction_delta = None
                  conflicting_date_values_by_file = {}
          ''',
          '''        timezone_correction_delta = None
                  conflicting_date_values_by_file = {}
                  date_conflict_resolved = False
                  preferred_system_offset_minutes = None
          ''',
          "group system-time state",
          )

          replace_once(
          '''            # Remember the rejected embedded values per file. The copy pass
              # aligns only eligible capture/creation fields carrying one of
              # these values; unrelated timestamps are not overwritten.
              conflicting_date_values_by_file = {
          ''',
          '''            date_conflict_resolved = True

              # Remember the rejected embedded values per file. The copy pass
              # aligns only eligible capture/creation fields carrying one of
              # these values; unrelated timestamps are not overwritten.
              conflicting_date_values_by_file = {
          ''',
          "date-conflict system-time activation",
          )

          replace_once(
          '''            if selected_file_date[0] == 2:
                  timezone_correction_delta = (
                      selected_file_date[1] - uncorrected_datetime
                  )

              for same_stem_file in same_stem_files:
          ''',
          '''            if selected_file_date[0] == 2:
                  timezone_correction_delta = (
                      selected_file_date[1] - uncorrected_datetime
                  )

              selected_offsets = {
                  offset_record[2]
                  for offset_record in selected_date_option.get(
                      "offset_records",
                      [],
                  )
              }
              if len(selected_offsets) == 1:
                  preferred_system_offset_minutes = next(iter(selected_offsets))

              for same_stem_file in same_stem_files:
          ''',
          "selected system offset",
          )

          replace_once(
          '''            corrected_copy = (
                  (
                      timezone_correction_delta is not None
                      or bool(conflicting_date_values)
                  )
                  and same_stem_file not in review_reasons
              )
              already_corrected = False
          ''',
          '''            align_system_times = (
                  date_conflict_resolved
                  or timezone_correction_delta is not None
              ) and same_stem_file not in review_reasons
              corrected_copy = (
                  (align_system_times or bool(conflicting_date_values))
                  and same_stem_file not in review_reasons
              )
              already_corrected = False
          ''',
          "classified-copy system-time activation",
          )

          replace_once(
          '''                        classification_timezone,
                          conflicting_date_values,
                      )
                  else:
          ''',
          '''                        classification_timezone,
                          conflicting_date_values,
                          align_system_times,
                          preferred_system_offset_minutes,
                      )
                  else:
          ''',
          "copy correction arguments",
          )

          script_path.write_text(text, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          old_conflict = '''After the user chooses the authoritative value, the classified copies are normalized to that decision. For each file, eligible capture/creation fields carrying one of the rejected complete timestamps are rewritten to the chosen timestamp. Paired IPTC date/time components are updated together, and derived Composite values follow the corrected underlying fields. Existing inline or separate UTC offsets and writable daylight-saving settings are adjusted for the chosen local date when their representation is unambiguous.

          This alignment is deliberately narrower than a blanket metadata rewrite: UTC reference fields, editing/history/resource timestamps, and unrelated filesystem creation or modification times are not replaced merely because a capture-date conflict was resolved. If the chosen value subsequently receives a timezone/daylight-saving correction, both the selected fields and the rejected conflicting fields converge on the final corrected value. As with DST correction, only classified copies are edited; original source files remain unchanged.
          '''
          new_conflict = '''After the user chooses the authoritative value, the classified copies are normalized to that decision. For each file, eligible capture/creation fields carrying one of the rejected complete timestamps are rewritten to the chosen timestamp. Paired IPTC date/time components are updated together, and derived Composite values follow the corrected underlying fields. Existing inline or separate UTC offsets and writable daylight-saving settings are adjusted for the chosen local date when their representation is unambiguous.

          The system timestamps are aligned as part of the same decision. Every classified copy in the related group receives the final chosen value as `FileModifyDate` when its current value differs. Existing `FileCreateDate` is also changed to the same absolute timestamp when the operating system exposes it and ExifTool can write it. The chosen local time is converted with the selected metadata offset when valid, otherwise with the sole unambiguous offset from the configured IANA timezone.

          The metadata alignment remains narrower than a blanket rewrite: UTC reference fields and editing/history/resource timestamps are not replaced merely because a capture-date conflict was resolved. If the chosen value subsequently receives a timezone/daylight-saving correction, the metadata fields and system timestamps converge on that final corrected value. Only classified copies are edited; original source files remain unchanged.
          '''
          if readme.count(old_conflict) != 1:
              raise SystemExit("README conflict-alignment text did not match")
          readme = readme.replace(old_conflict, new_conflict, 1)

          old_system = '''The filesystem `FileModifyDate` is set from the source file's timestamp plus the approved correction on every corrected copy. This includes groups classified from the system fallback and makes repeated runs idempotent. `FileCreateDate` is also corrected when the operating system exposes it and ExifTool can write it.
          '''
          new_system = '''When a date conflict is resolved or a timezone/daylight-saving correction is accepted, `FileModifyDate` is set to the absolute final chosen timestamp rather than calculated from the source file's previous modification time. `FileCreateDate` is set to the same timestamp when the platform exposes it and ExifTool can write it. Values already equal to the final timestamp are left untouched. This keeps software that relies on filesystem dates consistent with the metadata decision and remains idempotent across repeated runs.

          An absolute filesystem timestamp requires one UTC offset. The script prefers the offset carried by the chosen metadata when it is valid for the configured timezone. Otherwise it uses the timezone database when exactly one offset is valid. During an unresolved repeated-hour ambiguity, system-time alignment is reported as skipped rather than silently choosing the wrong instant.
          '''
          if readme.count(old_system) != 1:
              raise SystemExit("README system-time text did not match")
          readme = readme.replace(old_system, new_system, 1)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Compile and run focused regression checks
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile reclassify_datetaken.py
          python - <<'PY'
          import ast
          import os
          import tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_path = Path("reclassify_datetaken.py")
          source = source_path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          safe_body = []
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "directory"
                  for target in node.targets
              ):
                  break
              safe_body.append(node)
          namespace = {}
          exec(
              compile(
                  ast.Module(body=safe_body, type_ignores=[]),
                  str(source_path),
                  "exec",
              ),
              namespace,
          )

          berlin = ZoneInfo("Europe/Berlin")
          resolve_offset = namespace["resolve_system_timestamp_offset"]
          to_epoch_ns = namespace["system_datetime_to_epoch_ns"]
          build = namespace["build_correction_operations"]

          summer = datetime(2024, 9, 14, 0, 40, 47)
          assert resolve_offset(summer, berlin) == 120
          repeated = datetime(2024, 10, 27, 2, 30, 0)
          assert resolve_offset(repeated, berlin) is None
          assert resolve_offset(repeated, berlin, 60) == 60
          assert to_epoch_ns(datetime(1970, 1, 1), 0) == 0

          metadata = {
              "File:System:FileCreateDate": "2020:01:02 03:04:05+01:00",
          }
          operations, skipped = build(
              metadata,
              None,
              summer,
              berlin,
              set(),
              True,
              120,
          )
          file_create = [
              operation
              for operation in operations
              if operation["target"] == "FileCreateDate"
          ]
          assert len(file_create) == 1
          assert file_create[0]["expected"] == (summer, 120)
          assert file_create[0]["value"] == "2024:09:14 00:40:47+02:00"
          assert not skipped

          same_metadata = {
              "File:System:FileCreateDate": "2024:09:14 00:40:47+02:00",
          }
          operations, skipped = build(
              same_metadata,
              None,
              summer,
              berlin,
              set(),
              True,
              120,
          )
          assert operations == []
          assert not skipped

          namespace["read_correction_metadata"] = lambda *args: {}
          namespace["build_correction_operations"] = lambda *args: ([], set())
          namespace["execute_correction_operations"] = lambda *args: ([], [])
          update_copy = namespace["update_corrected_copy_metadata"]
          with tempfile.TemporaryDirectory() as temp_directory:
              test_file = Path(temp_directory) / "copy.nef"
              test_file.write_bytes(b"test")
              os.utime(test_file, ns=(0, 0))
              updated, skipped = update_copy(
                  object(),
                  test_file,
                  test_file,
                  None,
                  summer,
                  berlin,
                  set(),
                  True,
                  120,
              )
              expected_ns = to_epoch_ns(summer, 120)
              assert test_file.stat().st_mtime_ns == expected_ns
              assert updated == ["FileModifyDate"]
              assert skipped == []

              updated, skipped = update_copy(
                  object(),
                  test_file,
                  test_file,
                  None,
                  summer,
                  berlin,
                  set(),
                  True,
                  120,
              )
              assert updated == []
              assert skipped == []

          required = [
              "date_conflict_resolved = True",
              "align_system_times = (",
              "system_datetime_to_epoch_ns(",
              "FileModifyDate (ambiguous selected-date UTC offset)",
          ]
          missing = [text for text in required if text not in source]
          if missing:
              raise SystemExit(f"missing expected system alignment code: {missing}")

          readme = Path("README.md").read_text(encoding="utf-8")
          if "Every classified copy in the related group receives" not in readme:
              raise SystemExit("README system-time alignment section missing")
          PY

      - name: Commit finalized files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-system-date-alignment.yml
          git add reclassify_datetaken.py README.md
          git commit -m "Align system file dates to selected value"
          git push origin HEAD:agent/replace-pillow-pyexiftool
