name: Cleanup temporary artifacts

on:
  pull_request:
    types:
      - reopened
    branches:
      - agent/replace-pillow-pyexiftool

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-pillow-pyexiftool
          fetch-depth: 0

      - name: Remove cleanup workflow from feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/cleanup-temporary-artifacts.yml
          git commit -m "Remove temporary cleanup workflow"
          git push origin HEAD:agent/replace-pillow-pyexiftool

      - name: Delete temporary branches
        shell: bash
        run: |
          for branch in \
            tmp/date-conflict-alignment-trigger \
            tmp/system-date-alignment-trigger \
            tmp/system-date-alignment-v4-trigger \
            tmp/system-date-alignment-v5-trigger \
            tmp/system-date-guard-fix-trigger
          do
            git push origin --delete "$branch" || true
          done
